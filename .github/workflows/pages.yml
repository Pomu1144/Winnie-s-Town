name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Ship only what the game loads; the full-size source art stays in the repo.
      - name: Assemble site
        run: |
          mkdir -p _site/assets/characters
          cp *.html manifest.webmanifest _site/
          cp -r css js _site/
          cp -r assets/units assets/arenas assets/ui assets/opt _site/assets/
          cp assets/characters/princess_bear_seal.png _site/assets/characters/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
